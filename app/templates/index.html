<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jwalt</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#F1EFE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1EFE7;
    --paper-raised: #FBFAF6;
    --ink: #21262B;
    --ink-soft: #565F66;
    --rule: #D9D4C6;
    --mark: #A8402E;
    --link: #3D6270;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page{ max-width: 640px; margin: 0 auto; padding: 0 20px 64px; }

  header{
    display:flex; align-items:center; padding: 22px 0 16px;
    border-bottom: 2px solid var(--ink);
  }
  .wordmark{ font-family:'IBM Plex Mono', monospace; font-weight:500; font-size: 15px; }
  .wordmark span{ color: var(--mark); }
  .wordmark small{
    display:block; font-family:'IBM Plex Sans', sans-serif; font-weight: 400;
    color: var(--ink-soft); font-size: 11px; letter-spacing: 0.06em; margin-top: 2px;
  }

  form.intake{ display:flex; gap: 8px; margin: 18px 0 40px; }
  .intake input{
    flex:1; min-width:0; border: 1.5px solid var(--rule); background: var(--paper-raised);
    padding: 12px 14px; font-family:'IBM Plex Mono', monospace; font-size: 13px;
    color: var(--ink); border-radius: 3px;
  }
  .intake input:focus{ outline: none; border-color: var(--ink); }
  .intake button{
    border: none; background: var(--ink); color: var(--paper-raised);
    font-family:'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13px;
    padding: 0 18px; border-radius: 3px; cursor:pointer;
  }
  .intake button:focus-visible{ outline: 2px solid var(--mark); outline-offset: 2px; }

  .share-btn{
    border: 1px solid var(--ink); background: transparent; color: var(--ink);
    width: 30px; height: 30px; flex-shrink: 0; display:flex; align-items:center; justify-content:center;
    border-radius: 3px; cursor: pointer; margin-left: auto;
  }
  .share-btn:hover{ background: var(--ink); color: var(--paper-raised); }
  .share-btn:focus-visible{ outline: 2px solid var(--mark); outline-offset: 2px; }
  .share-btn svg{ width: 16px; height: 16px; }

  .error-box{
    background: var(--paper-raised); border: 1px solid var(--mark); border-left: 4px solid var(--mark);
    padding: 12px 14px; font-size: 13.5px; color: var(--ink); margin: 0 0 32px; border-radius: 3px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    color: var(--mark); text-transform: uppercase;
  }
  h1{
    font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 30px;
    line-height: 1.18; margin: 8px 0 4px; letter-spacing: -0.01em;
  }
  .source-link{ font-size: 12.5px; color: var(--link); text-decoration: none; border-bottom: 1px solid rgba(61,98,112,0.35); }
  .meta-row{ display:flex; flex-wrap: wrap; align-items:center; gap: 10px; margin: 14px 0 32px; color: var(--ink-soft); font-size: 12.5px; }
  .meta-row .sep{ color: var(--rule); }

  .cards{ display:flex; flex-direction: column; gap: 28px; }
  figure.card{
    margin:0; background: var(--paper-raised); border: 1px solid var(--rule);
    border-radius: 4px; overflow: hidden; position: relative;
  }
  .tag{
    position:absolute; top: 10px; left: 10px; background: var(--mark); color: var(--paper-raised);
    font-family:'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em;
    padding: 3px 7px; border-radius: 2px; transform: rotate(-2deg); box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  figure.card img{ display:block; width:100%; height:auto; background: #DEDAD0; }   /* the whole picture, at its own proportions */
  figcaption{ padding: 14px 16px 16px; border-top: 1px solid var(--rule); }
  figcaption p{ margin:0; font-family:'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.55; color: var(--ink); }

  .empty-state{
    background: var(--paper-raised); border: 1px solid var(--rule); border-left: 4px solid var(--ink-soft);
    padding: 16px 18px; font-size: 14px; color: var(--ink); border-radius: 3px;
  }

  footer{
    margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rule);
    font-size: 11.5px; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace;
  }
  footer a{ color: var(--link); text-decoration: none; border-bottom: 1px solid rgba(61,98,112,0.35); }
  footer .sep{ color: var(--rule); margin: 0 8px; }

  @media (min-width: 620px){
    .cards{ display:grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    h1{ font-size: 36px; }
  }
  @media (min-width: 900px){
    .page{ max-width: 920px; }
  }
  @media (min-width: 1180px){
    .page{ max-width: 1120px; }
    .cards{ grid-template-columns: repeat(3, 1fr); }
  }

  .loading-overlay{
    position: fixed; inset: 0; background: var(--paper);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; z-index: 100;
  }
  .loading-overlay.active{ display: flex; }
  .spinner{
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--rule); border-top-color: var(--mark);
    animation: spin 0.8s linear infinite;
  }
  .loading-overlay p{
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p>Leyendo el artículo…</p>
  </div>

  <div class="page">

    <header>
      <div class="wordmark">
        jw<span>alt</span>
        <small>ve las descripciones de imagen de un artículo</small>
      </div>
    </header>

    <form class="intake" id="intakeForm">
      <input type="text" inputmode="url" id="urlInput" placeholder="https://www.jw.org/finder?docid=..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Enlace del artículo de jw.org" required>
      <button type="submit">Ver →</button>
    </form>

    <div id="results"></div>

    <footer>
      <span>jwalt.joelgoncalves.es</span>
      <span class="sep">·</span>
      <a href="/docs">API docs</a>
      <span class="sep">·</span>
      <a href="/health">health</a>
    </footer>

  </div>

  <script>
    const overlay = document.getElementById('loadingOverlay');
    const results = document.getElementById('results');
    const input = document.getElementById('urlInput');
    const form = document.getElementById('intakeForm');

    function pluralImagenes(n) {
      return n === 1 ? 'imagen' : 'imágenes';
    }

    function normalizeUrl(u) {
      u = u.trim();
      if (!/^https?:\/\//i.test(u)) {
        u = 'https://' + u;
      }
      return u;
    }

    function extractUrlFromText(text) {
      const match = text.match(/https?:\/\/\S+/i);
      return match ? match[0] : text;
    }

    function renderError(message) {
      results.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'error-box';
      box.textContent = message;
      results.appendChild(box);
    }

    function renderArticle(data) {
      results.innerHTML = '';

      const eyebrow = document.createElement('span');
      eyebrow.className = 'eyebrow';
      eyebrow.textContent = 'jw.org';
      results.appendChild(eyebrow);

      const h1 = document.createElement('h1');
      h1.textContent = data.title;
      results.appendChild(h1);

      const metaRow = document.createElement('div');
      metaRow.className = 'meta-row';
      const sourceLink = document.createElement('a');
      sourceLink.className = 'source-link';
      sourceLink.href = data.source_url;
      sourceLink.target = '_blank';
      sourceLink.rel = 'noopener';
      sourceLink.textContent = 'Ver artículo original';
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '·';
      const count = document.createElement('span');
      count.textContent = data.images.length + ' ' + pluralImagenes(data.images.length) + ' con descripción';
      metaRow.append(sourceLink, sep, count);
      results.appendChild(metaRow);

      if (data.images.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.innerHTML = 'Este artículo no tiene ninguna imagen con texto alternativo (<code>alt</code>).';
        results.appendChild(empty);
        return;
      }

      if (navigator.share) {
        const shareBtn = document.createElement('button');
        shareBtn.type = 'button';
        shareBtn.className = 'share-btn';
        shareBtn.setAttribute('aria-label', 'Compartir');
        shareBtn.title = 'Compartir';
        shareBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M8 7l4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
        shareBtn.addEventListener('click', function () {
          navigator.share({ title: data.title, url: location.href }).catch(function () {});
        });
        metaRow.appendChild(shareBtn);
      }

      const cards = document.createElement('div');
      cards.className = 'cards';

      data.images.forEach(function (img) {
        const figure = document.createElement('figure');
        figure.className = 'card';

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'ALT';

        const image = document.createElement('img');
        image.src = img.src;
        image.alt = '';

        const figcaption = document.createElement('figcaption');
        const p = document.createElement('p');
        p.textContent = img.alt;
        figcaption.appendChild(p);

        figure.append(tag, image, figcaption);
        cards.appendChild(figure);
      });

      results.appendChild(cards);
    }

    function loadArticle(url) {
      overlay.classList.add('active');
      results.innerHTML = '';

      fetch('/api/extract?url=' + encodeURIComponent(url))
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          overlay.classList.remove('active');
          if (!result.ok) {
            renderError(result.data.detail || 'No se ha podido leer ese enlace.');
          } else {
            renderArticle(result.data);
          }
        })
        .catch(function () {
          overlay.classList.remove('active');
          renderError('No se ha podido conectar con el servidor. Inténtalo de nuevo.');
        });
    }


    // Pasting: take the plain-text version of the clipboard (iOS may otherwise paste another representation of the
    // copied link) and keep only the first URL in it, so the text JW Library shares (title + link) works too.
    input.addEventListener('paste', function (e) {
      const plain = ((e.clipboardData && e.clipboardData.getData('text/plain')) || '').trim();
      if (!plain) return;
      e.preventDefault();
      input.value = extractUrlFromText(plain);
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const raw = input.value.trim();
      if (!raw) return;
      const url = normalizeUrl(extractUrlFromText(raw));      // also accepts the text JW Library shares (title + link)
      input.value = url;
      history.replaceState(null, '', '/?url=' + encodeURIComponent(url));
      loadArticle(url);
    });

    // Si llegamos con ?url=... ya puesto (p. ej. desde el Atajo de iOS),
    // arrancamos el fetch inmediatamente, sin esperar a que el usuario
    // toque el formulario.
    const shareParams = new URLSearchParams(location.search);
    const initialUrl = shareParams.get('url') || shareParams.get('text');
    if (initialUrl) {
      const url = normalizeUrl(extractUrlFromText(initialUrl));
      input.value = url;
      history.replaceState(null, '', '/?url=' + encodeURIComponent(url));
      loadArticle(url);
    }
  </script>
</body>
</html>
